button(x,y,text,fn){let b=this.add.text(x,y,text,{fontFamily:'monospace',fontSize:'10px',color:'#e7cea3',backgroundColor:'#46524b',padding:{x:8,y:10}}).setOrigin(.5,0).setInteractive({useHandCursor:true}).on('pointerdown',(p,lx,ly,e)=>{e.stopPropagation();fn()});this.hud.add(b)}
fullscreen(){if(this.scale.isFullscreen)this.scale.stopFullscreen();else this.scale.startFullscreen()}

nearCar(){return this.parked.find(p=>Math.abs(p.x-this.player.x)<65)}

interact(){if(this.dialog){this.close();return}this.target=null;if(!this.wallet&&Math.abs(this.player.x-1510)<35){this.wallet=true;this.walletSprite.setVisible(false);this.say('FOUND: leather wallet. The ID says MARA. Return it to Night Owl Records.');return}let s=shops.find(s=>Math.abs(s.x-this.player.x)<53);if(s){if(s===shops[0]&&this.wallet&&!this.returned){this.returned=true;this.cash+=20;this.say('Mara: My wallet! Thank you, officer. Here’s $20 for your trouble.');this.checkWin();return}this.say(s.line,7000);return}let p=this.nearCar();if(p){this.say(p.reason+(this.done.has(p.x)?' · ALREADY TICKETED':' · Press T to issue a ticket.'),6000);return}this.say('Walk near a storefront, parked car, or the wallet beside the newsstand.')}

update(time,delta){let dt=Math.min(delta,50)/1000;this.elapsed+=dt;for(let p of this.people){p.sprite.x+=p.v*dt;if(p.sprite.x<-20)p.sprite.x=WORLD+10;if(p.sprite.x>WORLD+20)p.sprite.x=-10;p.sprite.setFlipX(p.v<0).setTexture(`p${p.type}f${Math.floor(time/180)%4}`)}for(let c of this.traffic){c.sprite.x+=c.speed*dt;c.sprite.setFlipX(c.speed<0);if(c.sprite.x>WORLD+130)c.sprite.x=-130;if(c.sprite.x<-130)c.sprite.x=WORLD+130}let dx=0,dy=0;if(!this.dialog){dx=(this.keys.D.isDown||this.arrows.right.isDown?1:0)-(this.keys.A.isDown||this.arrows.left.isDown?1:0);dy=(this.keys.S.isDown||this.arrows.down.isDown?1:0)-(this.keys.W.isDown||this.arrows.up.isDown?1:0);if(dx||dy)this.target=null;if(this.target){let x=this.target.x-this.player.x,y=this.target.y-this.player.y;if(Math.hypot(x,y)<3)this.target=null;else{let l=Math.hypot(x,y);dx=x/l;dy=y/l}}let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}this.player.x=Phaser.Math.Clamp(this.player.x+dx*79*dt,16,WORLD-16);this.player.y=Phaser.Math.Clamp(this.player.y+dy*65*dt,303,343);if(dx)this.player.setFlipX(dx<0);this.player.setTexture('cop'+(dx||dy?Math.floor(time/140)%4:0)).setDepth(this.player.y)}let mins=17*60+Math.floor(this.elapsed/5);this.clock.setText(`NYC · 1985   ${String(Math.floor(mins/60)%24).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`);this.status.setText(`TICKETS ${this.tickets}/3    WALLET ${this.returned?'RETURNED':this.wallet?'FOUND':'MISSING'}    $${this.cash}`);let p=this.nearCar(),s=shops.find(s=>Math.abs(s.x-this.player.x)<53);this.hint.setText(s?'[E] '+s.name:!this.wallet&&Math.abs(this.player.x-1510)<35?'[E] Pick up leather wallet':p?'[E] Inspect car   [T] Issue ticket':'WASD / arrows / click to walk · E interact')}
