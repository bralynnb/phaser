leaveStore(){if(!this.inside)return;this.room.destroy();this.room=null;this.inside=null;this.target=null;this.outside.forEach(o=>o.setVisible(true));this.walletSprite.setVisible(!this.wallet);this.player.setPosition(this.streetPosition.x,this.streetPosition.y);this.cameras.main.setBounds(0,0,WORLD,H);this.cameras.main.centerOn(this.player.x,this.player.y);this.say('MERCER STREET · Back outside')}
fullscreen(){if(this.scale.isFullscreen)this.scale.stopFullscreen();else this.scale.startFullscreen()}
say(t,ms=4500){this.bubble.setText(t).setVisible(true);if(this.notice)this.notice.remove();this.notice=this.time.delayedCall(ms,()=>this.bubble.setVisible(false))}
nearCar(){return this.parked.find(p=>Math.abs(p.x-this.player.x)<65)}
close(){if(this.dialog){this.dialog.destroy(true);this.dialog=null}}
interact(){if(this.inside){if(Math.abs(this.player.x-480)<65&&this.player.y>375)this.leaveStore();else this.say('Empty for now. The exit is at the bottom center.');return}if(this.dialog){this.close();return}this.target=null;if(!this.wallet&&Math.abs(this.player.x-1510)<35){this.wallet=true;this.walletSprite.setVisible(false);this.say('FOUND: leather wallet. The ID says MARA. Return it to Night Owl Records.');return}let s=shops.find(s=>Math.abs(s.x+60-this.player.x)<36);if(s){if(s===shops[0]&&this.wallet&&!this.returned){this.returned=true;this.cash+=20;this.say('Mara: My wallet! Thank you. Here’s $20 for your trouble.');this.checkWin();return}this.enterStore(s);return}let p=this.nearCar();if(p){this.say(p.reason+(this.done.has(p.x)?' · ALREADY TICKETED':' · Press T to issue a ticket.'),6000);return}this.say('Walk near a storefront, parked car, or the wallet beside the newsstand.')}
ticket(){if(this.dialog||this.inside)return;const p=this.nearCar();if(!p){this.say('Move alongside a parked car to inspect it first.');return}if(this.done.has(p.x)){this.say('You already ticketed this car.');return}if(!p.bad){this.say('No violation. This driver still has time on the meter.');return}this.done.add(p.x);this.tickets++;let slip=this.add.rectangle(p.x+8,365,7,4,0xead9a5).setDepth(480);this.outside.push(slip);this.uiCamera.ignore(slip);this.say('TICKET ISSUED · '+p.reason);this.checkWin()}
checkWin(){if(this.tickets===3&&this.returned&&!this.finished){this.finished=true;this.time.delayedCall(900,()=>{this.dialog=this.add.container(480,230).setScrollFactor(0).setDepth(3000);this.cameras.main.ignore(this.dialog);this.dialog.add(this.add.rectangle(0,0,450,185,0x263331).setStrokeStyle(3,0xb69768));this.dialog.add(this.add.text(0,-65,'SHIFT COMPLETE',{fontFamily:'monospace',fontSize:'24px',color:'#e8cd97'}).setOrigin(.5));this.dialog.add(this.add.text(0,-16,'3 valid tickets · Wallet returned\nA small victory on Mercer Street.',{fontFamily:'monospace',fontSize:'14px',color:'#b4c2b1',align:'center'}).setOrigin(.5));this.dialog.add(this.add.text(0,53,'KEEP EXPLORING  [E]',{fontFamily:'monospace',fontSize:'14px',color:'#e8cd97',backgroundColor:'#526153',padding:{x:12,y:8}}).setOrigin(.5).setInteractive().on('pointerdown',()=>this.close()))})}}
update(time,delta){let dt=Math.min(delta,50)/1000;this.elapsed+=dt;for(let p of this.people){p.sprite.x+=p.v*dt;if(p.sprite.x<-20)p.sprite.x=WORLD+10;if(p.sprite.x>WORLD+20)p.sprite.x=-10;p.sprite.setFlipX(p.v<0).setTexture(`p${p.type}f${Math.floor(time/180)%4}`)}for(let c of this.traffic){c.sprite.x+=c.speed*dt;c.sprite.setFlipX(c.speed<0);if(c.sprite.x>WORLD+130)c.sprite.x=-130;if(c.sprite.x<-130)c.sprite.x=WORLD+130}let dx=0,dy=0;if(!this.dialog){dx=(this.keys.D.isDown||this.arrows.right.isDown?1:0)-(this.keys.A.isDown||this.arrows.left.isDown?1:0);dy=(this.keys.S.isDown||this.arrows.down.isDown?1:0)-(this.keys.W.isDown||this.arrows.up.isDown?1:0);if(dx||dy)this.target=null;if(this.target){let x=this.target.x-this.player.x,y=this.target.y-this.player.y;if(Math.hypot(x,y)<3)this.target=null;else{let l=Math.hypot(x,y);dx=x/l;dy=y/l}}let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}this.player.x=Phaser.Math.Clamp(this.player.x+dx*79*dt,this.inside?90:16,this.inside?870:WORLD-16);this.player.y=Phaser.Math.Clamp(this.player.y+dy*65*dt,this.inside?250:303,this.inside?430:343);if(dx)this.player.setFlipX(dx<0);this.player.setTexture('cop'+(dx||dy?Math.floor(time/140)%4:0)).setDepth(this.player.y)}let mins=17*60+Math.floor(this.elapsed/5);this.clock.setText(`NYC · 1985   ${String(Math.floor(mins/60)%24).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`);this.status.setText(`TICKETS ${this.tickets}/3    WALLET ${this.returned?'RETURNED':this.wallet?'FOUND':'MISSING'}    $${this.cash}`);let p=this.nearCar(),s=shops.find(s=>Math.abs(s.x+60-this.player.x)<36);this.hint.setText(this.inside?(Math.abs(this.player.x-480)<65&&this.player.y>375?'[E] Exit to Mercer Street':'Empty store · exit at bottom center'):s?'[E] Enter '+s.name:!this.wallet&&Math.abs(this.player.x-1510)<35?'[E] Pick up leather wallet':p?'[E] Inspect car   [T] Issue ticket':'WASD / arrows / click to walk · E interact')}
}
window.game=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,pixelArt:true,roundPixels:true,backgroundColor:'#20282a',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Street});
</script></body></html>
